services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: assistant-postgres
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./docker/init-pgvector.sql
        target: /docker-entrypoint-initdb.d/init-pgvector.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
